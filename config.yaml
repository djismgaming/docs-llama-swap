# Llama-Swap config and run
# C:\Users\Ismael\apps\llama-swap\llama-swap.exe -watch-config -config c:\Users\Ismael\code\llama-swap\config.yaml

metricsMaxInMemory: 100 # maximum records for metrics
macros:
  "llamacpp-vulkan": >
    C:\Users\Ismael\apps\llamacpp-vulkan\llama-server.exe
    --port ${PORT}
    --no-mmap

  "llamacpp-rocm": >
    C:\Users\Ismael\apps\llamacpp-rocm\llama-server.exe
    --port ${PORT}
    --no-mmap

  "llamacpp-rocm-80k": >
    C:\Users\Ismael\apps\llamacpp-rocm\llama-server.exe
    --port ${PORT}
    --no-mmap
    --jinja
    --ctx-size 80000

  "llamacpp-rocm-60k": >
    C:\Users\Ismael\apps\llamacpp-rocm\llama-server.exe
    --port ${PORT}
    --no-mmap
    --jinja
    --ctx-size 60000

  "llamacpp-rocm-40k": >
    C:\Users\Ismael\apps\llamacpp-rocm\llama-server.exe
    --port ${PORT}
    --no-mmap
    --jinja
    --ctx-size 40000

models:
  GLM-4.7-Flash Tool:
    ttl: 900 # seconds to unload the model after use
    cmd: | # support for multi-line
      ${llamacpp-rocm-80k}
      -m F:/ai/lmstudio-models/unsloth/GLM-4.7-Flash-GGUF/GLM-4.7-Flash-UD-Q4_K_XL.gguf
      --temp 0.7 --top-p 1.0
      --min-p 0.01
      --cpu-moe

  GLM-4.7-Flash Tool 40K:
    ttl: 900 # seconds to unload the model after use
    cmd: | # support for multi-line
      ${llamacpp-rocm-40k}
      -m F:/ai/lmstudio-models/unsloth/GLM-4.7-Flash-GGUF/GLM-4.7-Flash-UD-Q4_K_XL.gguf
      --temp 0.7 --top-p 1.0
      --min-p 0.01
      --cpu-moe

  GLM-4.7-Flash Chat:
    ttl: 900 # seconds to unload the model after use
    cmd: | # support for multi-line
      ${llamacpp-rocm-40k}
      -m F:/ai/lmstudio-models/unsloth/GLM-4.7-Flash-GGUF/GLM-4.7-Flash-UD-Q4_K_XL.gguf
      --temp 1.0 --top-p 0.95
      --min-p 0.01
      --cpu-moe

  GLM-4.6V-Flash:
    ttl: 900 # seconds to unload the model after use
    cmd: | # support for multi-line
      ${llamacpp-rocm-80k}
      -m F:/ai/lmstudio-models/unsloth/GLM-4.6V-Flash-GGUF/GLM-4.6V-Flash-Q4_K_M.gguf
      --flash-attn on
      --temp 0.8
      --top-p 0.6
      --top-k 2
      --repeat_penalty 1.1

  GLM-4.6V-Flash Vision:
    ttl: 900 # seconds to unload the model after use
    cmd: | # support for multi-line
      ${llamacpp-rocm-80k}
      -m F:/ai/lmstudio-models/unsloth/GLM-4.6V-Flash-GGUF/GLM-4.6V-Flash-Q4_K_XL.gguf
      --flash-attn on
      --temp 0.8
      --top-p 0.6
      --top-k 2
      --repeat_penalty 1.1
      --mmproj F:/ai/lmstudio-models/unsloth/GLM-4.6V-Flash-GGUF/mmproj-F32.gguf

  GPT-OSS-20B:
    ttl: 900 # seconds to unload the model after use
    aliases:
      - gpt-oss-20b
      - gpt-oss
    cmd: | # support for multi-line
      ${llamacpp-rocm-80k}
      --grammar-file C:\Users\Ismael\code\docs-llama-swap\gpt-oss.gbnf
      -m F:\ai\lmstudio-models\lmstudio-community\gpt-oss-20b-GGUF\gpt-oss-20b-MXFP4.gguf
      --temp 1.0
      --top-p 1.0
      --parallel 1
      -b 2056 -ub 256
      --repeat-penalty 1.0 --repeat-last-n 200
      --cache-type-k q8_0 --cache-type-v q8_0

  GPT-OSS-20B Full:
    ttl: 900 # seconds to unload the model after use
    cmd: | # support for multi-line
      ${llamacpp-rocm}
      --grammar-file C:\Users\Ismael\code\docs-llama-swap\gpt-oss.gbnf
      -m F:\ai\lmstudio-models\lmstudio-community\gpt-oss-20b-GGUF\gpt-oss-20b-MXFP4.gguf
      --temp 1.0
      --top-p 1.0
      --parallel 1
      -b 2056 -ub 256
      --repeat-penalty 1.0 --repeat-last-n 200
      --cache-type-k q8_0 --cache-type-v q8_0

  Qwen3-Coder-30B-A3B-Instruct:
    ttl: 900 # seconds to unload the model after use
    cmd: | # support for multi-line
      ${llamacpp-rocm}
      -m F:/ai/lmstudio-models/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF/Qwen3-Coder-30B-A3B-Instruct-Q3_K_S.gguf
      --jinja
      --temp 0.7
      --min-p 0.0
      --top-p 0.80
      --top-k 20
      --repeat-penalty 1.05
      --fit-ctx 60000

  Qwen2.5-Coder-7B:
    ttl: 900 # seconds to unload the model after use
    cmd: |
      ${llamacpp-rocm}
      -m F:/ai/lmstudio-models/lmstudio-community/Qwen2.5-Coder-7B-Instruct-GGUF/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf

  Qwen2.5-Coder-1.5B:
    ttl: 900 # seconds to unload the model after use
    cmd: |
      ${llamacpp-rocm}
      -m F:/ai/lmstudio-models/lmstudio-community/Qwen2.5-Coder-1.5B-Instruct-GGUF/Qwen2.5-Coder-1.5B-Instruct-Q8_0.gguf

  Ministral-3-14B-Reasoning-2512:
    ttl: 900 # seconds to unload the model after use
    cmd: |
      ${llamacpp-rocm-60k}
      -m F:/ai/lmstudio-models/lmstudio-community/Ministral-3-14B-Reasoning-2512-GGUF/Ministral-3-14B-Reasoning-2512-Q4_K_M.gguf
      --mmproj F:\ai\lmstudio-models\lmstudio-community\Ministral-3-14B-Reasoning-2512-GGUF\mmproj-Ministral-3-14B-Reasoning-2512-F16.gguf

  nomic-embed-text:
    ttl: 900 # seconds to unload the model after use
    cmd: |
      ${llamacpp-rocm}
      -m F:/ai/lmstudio-models/ggml-org/Nomic-Embed-Text-V2-GGUF/nomic-embed-text-v2-moe-q8_0.gguf

  whispercpp:
    ttl: 900 # seconds to unload the model after use
    cmd: | 
      C:\Users\Ismael\apps\whispercpp\whisper-server.exe
      --host 127.0.0.1
      --port ${PORT}
      -m C:\Users\Ismael\apps\whispercpp\models\ggml-small.bin
      --request-path /v1/audio/transcriptions
      --inference-path ""
      --convert
      -l auto
      -pp
      -pr
    checkEndpoint: /v1/audio/transcriptions/
    unlisted: true
    env:
      - "RESPONSE_FORMAT=TXT"

groups:
  group1:
    swap: false
    members:
      - "GPT-OSS-20B"
      - "Qwen2.5-Coder-1.5B"
      - "nomic-embed-text"